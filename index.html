<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition Scoreboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeIn 1s ease-in;
    }

    .competition-name {
      font-size: 3.5rem;
      font-weight: bold;
      background: linear-gradient(45deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    }

    .competition-dates {
      font-size: 1.5rem;
      color: #a0a0a0;
      margin-bottom: 0.5rem;
    }

    .last-updated {
      font-size: 1rem;
      color: #666;
      margin-top: 1rem;
    }

    .leaderboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
      padding: 1rem;
    }

    .team-row {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
      padding: 1.5rem 2rem;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      animation: slideIn 0.5s ease-out backwards;
    }

    .team-row:hover {
      transform: translateX(10px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
    }

    .rank {
      font-size: 3rem;
      font-weight: bold;
      width: 80px;
      text-align: center;
      margin-right: 2rem;
    }

    .rank-1 {
      background: linear-gradient(45deg, #ffd700, #ffed4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }

    .rank-2 {
      background: linear-gradient(45deg, #c0c0c0, #e8e8e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .rank-3 {
      background: linear-gradient(45deg, #cd7f32, #ffa500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .team-name {
      flex: 1;
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .team-points {
      font-size: 3rem;
      font-weight: bold;
      background: linear-gradient(45deg, #00d4ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      min-width: 150px;
      text-align: right;
    }

    .error-message {
      text-align: center;
      padding: 3rem;
      font-size: 1.8rem;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 1rem;
      border: 1px solid rgba(255, 107, 107, 0.3);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      font-size: 2rem;
      color: #00d4ff;
    }

    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0, 212, 255, 0.3);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 1rem;
    }

    .no-competition {
      text-align: center;
      padding: 3rem;
      font-size: 1.8rem;
      color: #a0a0a0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Staggered animation for team rows */
    .team-row:nth-child(1) { animation-delay: 0.1s; }
    .team-row:nth-child(2) { animation-delay: 0.2s; }
    .team-row:nth-child(3) { animation-delay: 0.3s; }
    .team-row:nth-child(4) { animation-delay: 0.4s; }
    .team-row:nth-child(5) { animation-delay: 0.5s; }
    .team-row:nth-child(6) { animation-delay: 0.6s; }
    .team-row:nth-child(7) { animation-delay: 0.7s; }
    .team-row:nth-child(8) { animation-delay: 0.8s; }
    .team-row:nth-child(9) { animation-delay: 0.9s; }
    .team-row:nth-child(10) { animation-delay: 1s; }

    /* Responsive design */
    @media (max-width: 1200px) {
      .competition-name { font-size: 2.5rem; }
      .team-name { font-size: 2rem; }
      .team-points { font-size: 2.5rem; }
      .rank { font-size: 2.5rem; }
    }

    @media (max-width: 768px) {
      .competition-name { font-size: 2rem; }
      .competition-dates { font-size: 1.2rem; }
      .team-name { font-size: 1.5rem; }
      .team-points { font-size: 2rem; min-width: 100px; }
      .rank { font-size: 2rem; width: 60px; margin-right: 1rem; }
      .team-row { padding: 1rem 1.5rem; }
      .container { padding: 1rem; }
    }

    /* Scrollbar styling */
    .leaderboard::-webkit-scrollbar {
      width: 10px;
    }

    .leaderboard::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .leaderboard::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, #00d4ff, #7b2ff7);
      border-radius: 10px;
    }

    .leaderboard::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(45deg, #7b2ff7, #00d4ff);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="competition-name" id="competitionName">Competition Scoreboard</div>
      <div class="competition-dates" id="competitionDates"></div>
      <div class="last-updated" id="lastUpdated"></div>
    </div>
    <div class="leaderboard" id="leaderboard">
      <div class="loading">
        Loading scoreboard...
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <script>
    // Configuration - Set these values before deploying
    // Option A: Embedded configuration (recommended)
    const API_KEY = window.SCOREBOARD_API_KEY || '7d667bc07a11c75d1077f60b2a1bd992aa229c48d8135b35cfb5b9f9a48b1af0';
    const API_URL = window.SCOREBOARD_API_URL || 'https://meetings.upvolt.tech/api/public/competition/scoreboard';
    // Injected at build time when the API is reachable from CI (bypasses browser CORS)
    const BUILD_SNAPSHOT = {"competition":{"name":"Central Team Competition","startDate":"2026-10-01","endDate":"2026-10-23","status":"draft"},"leaderboard":[{"name":"Invictus","points":0},{"name":"Helios","points":0}],"lastUpdated":"2026-09-30T00:28:06.304Z"};
    
    // Option B: Read from query parameter (less secure)
    const params = new URLSearchParams(window.location.search);
    const API_KEY_FROM_PARAM = params.get('key');
    const FINAL_API_KEY = API_KEY_FROM_PARAM || API_KEY;

    // Refresh interval in milliseconds (default: 60 seconds)
    const REFRESH_INTERVAL = 60000;

    // DOM elements
    const leaderboardEl = document.getElementById('leaderboard');
    const competitionNameEl = document.getElementById('competitionName');
    const competitionDatesEl = document.getElementById('competitionDates');
    const lastUpdatedEl = document.getElementById('lastUpdated');

    // Fetch and display scoreboard data
    async function fetchScoreboard() {
      try {
        if (!FINAL_API_KEY) {
          if (BUILD_SNAPSHOT) {
            displayScoreboard(BUILD_SNAPSHOT);
            return;
          }
          throw new Error('API key not configured. Please set SCOREBOARD_API_KEY or provide ?key=... parameter.');
        }

        // Live browser fetch uses ?key= (simple request, no CORS preflight).
        // Until Meeting Calendar serves ?key= in prod, BUILD_SNAPSHOT from CI is the fallback.
        const url = new URL(API_URL, window.location.href);
        url.searchParams.set('key', FINAL_API_KEY);
        const response = await fetch(url.toString(), { method: 'GET' });

        if (!response.ok) {
          if (BUILD_SNAPSHOT) {
            displayScoreboard(BUILD_SNAPSHOT);
            return;
          }
          if (response.status === 401) {
            throw new Error('Invalid API key');
          } else if (response.status === 404) {
            throw new Error('API endpoint not found');
          } else {
            throw new Error(`Server error: ${response.status}`);
          }
        }

        const data = await response.json();
        displayScoreboard(data);
      } catch (error) {
        if (BUILD_SNAPSHOT) {
          displayScoreboard(BUILD_SNAPSHOT);
          return;
        }
        displayError(error.message);
        console.error('Error fetching scoreboard:', error);
      }
    }

    // Display the scoreboard
    function displayScoreboard(data) {
      // API returns active, else draft, else latest — show any of those on the TV board
      if (!data.competition) {
        leaderboardEl.innerHTML = `
          <div class="no-competition">
            No active competition at this time
          </div>
        `;
        competitionNameEl.textContent = 'Competition Scoreboard';
        competitionDatesEl.textContent = '';
        lastUpdatedEl.textContent = '';
        return;
      }

      // Update header
      const statusLabel = data.competition.status && data.competition.status !== 'active'
        ? ` (${data.competition.status})`
        : '';
      competitionNameEl.textContent = (data.competition.name || 'Competition') + statusLabel;
      
      const startDate = formatDate(data.competition.startDate);
      const endDate = formatDate(data.competition.endDate);
      competitionDatesEl.textContent = `${startDate} - ${endDate}`;
      
      const lastUpdated = new Date(data.lastUpdated).toLocaleString();
      lastUpdatedEl.textContent = `Last updated: ${lastUpdated}`;

      // Display leaderboard
      if (!data.leaderboard || data.leaderboard.length === 0) {
        leaderboardEl.innerHTML = `
          <div class="no-competition">
            No teams registered yet
          </div>
        `;
        return;
      }

      const leaderboardHTML = data.leaderboard.map((team, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        
        return `
          <div class="team-row">
            <div class="rank ${rankClass}">#${rank}</div>
            <div class="team-name">${escapeHtml(team.name)}</div>
            <div class="team-points">${team.points} pts</div>
          </div>
        `;
      }).join('');

      leaderboardEl.innerHTML = leaderboardHTML;
    }

    // Display error message
    function displayError(message) {
      leaderboardEl.innerHTML = `
        <div class="error-message">
          ⚠️ ${escapeHtml(message)}
        </div>
      `;
    }

    // Format date for display
    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    fetchScoreboard();
    
    // Auto-refresh
    setInterval(fetchScoreboard, REFRESH_INTERVAL);

    // Optional: Add visibility change listener to pause updates when tab is hidden
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        fetchScoreboard();
      }
    });
  </script>
</body>
</html>
